{% extends 'base.html' %}
{% block title %}Register - PARIS Inventaris{% endblock %}
{% block content %}

<div class="max-w-md mx-auto mt-20 bg-white shadow rounded-lg p-8">
    <h1 class="text-2xl font-bold text-center text-green-700 mb-6">Register</h1>
    <form method="post" class="space-y-6">
        {% csrf_token %}
        {% if messages %}
            {% for message in messages %}
                <div class="text-sm mb-2 {% if message.tags == 'success' %}text-green-700 bg-green-100 border border-green-300 px-3 py-2 rounded{% else %}text-red-600 bg-red-100 border border-red-300 px-3 py-2 rounded{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <div>
            <label for="nama" class="block text-sm font-medium text-gray-700">Nama</label>
            <input type="text" name="nama" id="nama" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" name="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
        </div>
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" name="username" id="username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" name="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
        </div>
        <button type="submit" class="w-full py-2 px-4 bg-green-600 text-white rounded hover:bg-green-700">Register</button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-600">Sudah punya akun? <a href="{% url 'accounts:login' %}" class="text-green-600 hover:underline">Login di sini</a></p>
</div>
{% endblock %}
