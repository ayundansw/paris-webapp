{% extends 'base.html' %}
{% block title %}Login - PARIS Inventaris{% endblock %}
{% block content %}

<div class="max-w-md mx-auto mt-20 bg-white shadow rounded-lg p-8">
    <h1 class="text-2xl font-bold text-center text-blue-700 mb-6">Login</h1>
    <form method="post" class="space-y-6">
        {% csrf_token %}
        {% if messages %}
            {% for message in messages %}
                <div class="text-sm mb-2 {% if message.tags == 'success' %}text-green-700 bg-green-100 border border-green-300 px-3 py-2 rounded{% else %}text-red-600 bg-red-100 border border-red-300 px-3 py-2 rounded{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" name="username" id="username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" name="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded hover:bg-blue-700">Login</button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-600">Belum punya akun? <a href="{% url 'accounts:register' %}" class="text-blue-600 hover:underline">Daftar di sini</a></p>
</div>
{% endblock %}
