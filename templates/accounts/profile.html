{% extends 'base.html' %}
{% block title %}Profil Pengguna{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white shadow rounded-lg p-6 mt-8">
    <h1 class="text-2xl font-bold mb-4">Profil Pengguna</h1>
    {% if messages %}
        {% for message in messages %}
            <div class="text-sm mb-2 {% if message.tags == 'success' %}text-green-700 bg-green-100 border border-green-300 px-3 py-2 rounded{% else %}text-red-600 bg-red-100 border border-red-300 px-3 py-2 rounded{% endif %}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" value="{{ user.username }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-100" readonly>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Nama</label>
            {{ form.first_name }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            {{ form.email }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Keterangan</label>
            <textarea name="keterangan" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md">{{ keterangan }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" value="********" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-100" readonly>
        </div>
        <div class="flex space-x-2 mt-4">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Simpan</button>
        </div>
    </form>
</div>
{% endblock %}
