{% extends 'base.html' %}
{% block title %}Edit Foto Barang{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto bg-white shadow rounded-lg p-6 mt-8">
    <h1 class="text-2xl font-bold mb-4">Edit Foto Barang</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="flex space-x-2 mt-4">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Simpan</button>
            <a href="{% url 'inventaris:detail_barang' foto.barang.id %}" class="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
